<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Rich Artisan Crust Gradient -->
    <linearGradient id="crustGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="15%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Creamy Tender Crumb Interior Gradient -->
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef3c7" />
      <stop offset="80%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Top Crown Specular Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Minimal Clean Contact Shadow -->
    <radialGradient id="baseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone icon -->
  <rect width="100" height="100" fill="#0b0f19" />

  <!-- Centered & padded safe-zone loaf graphic (safe for circular/squircle crops) -->
  <g transform="translate(50, 50) scale(0.72) translate(-50, -50)">
    <!-- Clean Ground Contact Shadow -->
    <ellipse cx="51" cy="74" rx="36" ry="4.5" fill="url(#baseShadow)" />

    <!-- Main Batard Loaf Silhouette -->
    <path d="M 12,56 C 24,67 44,72 62,70 C 78,68 86,62 90,54 C 93,49 92,44 88,40 C 78,31 64,26 46,26 C 29,26 19,33 13,44 C 9,49 9,53 12,56 Z"
          fill="url(#crustGrad)"
          stroke="#5c2406"
          stroke-width="2.2"
          stroke-linejoin="round" />

    <!-- Underside Depth Shade -->
    <path d="M 12,56 C 24,67 44,72 62,70 C 78,68 86,62 90,54 C 80,61 66,64 52,64 C 36,64 22,61 12,56 Z"
          fill="#451a03"
          opacity="0.32" />

    <!-- Top Crown Sheen -->
    <path d="M 16,43 C 24,33 36,28 48,28 C 62,28 73,32 80,39 C 71,34 60,31 48,31 C 35,31 24,35 16,43 Z"
          fill="url(#sheenGrad)" />

    <!-- === SLASH 1 (Left / Front) === -->
    <path d="M 25,35 C 31,37 38,45 44,55 C 39,57 30,52 25,44 C 23,40 23,37 25,35 Z"
          fill="url(#crumbGrad)" />
    <path d="M 25,35 C 31,37 37,44 43,54 C 38,53 30,48 25,42 Z"
          fill="#92400e"
          opacity="0.28" />
    <path d="M 24,34 C 30,36 37,44 44.5,55"
          stroke="#5c2406"
          stroke-width="2.2"
          stroke-linecap="round"
          fill="none" />

    <!-- === SLASH 2 (Center) === -->
    <path d="M 45,28 C 52,30 60,38 67,49 C 62,51 52,46 47,38 C 45,34 44,30 45,28 Z"
          fill="url(#crumbGrad)" />
    <path d="M 45,28 C 51,30 59,37 66,48 C 60,47 52,41 46,34 Z"
          fill="#92400e"
          opacity="0.28" />
    <path d="M 44,27 C 51,29 59,37 67.5,49"
          stroke="#5c2406"
          stroke-width="2.2"
          stroke-linecap="round"
          fill="none" />

    <!-- === SLASH 3 (Right / Back) === -->
    <path d="M 66,29 C 72,31 78,38 83,46 C 79,47 72,43 68,37 C 66,33 65,30 66,29 Z"
          fill="url(#crumbGrad)" />
    <path d="M 66,29 C 71,31 77,37 82,45 C 77,44 71,39 67,34 Z"
          fill="#92400e"
          opacity="0.28" />
    <path d="M 65,28 C 71,30 77,37 83.5,46"
          stroke="#5c2406"
          stroke-width="2.2"
          stroke-linecap="round"
          fill="none" />
  </g>
</svg>
