<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Rich Blistered Pizza Crust Gradient -->
    <linearGradient id="crustGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="18%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Molten Cheese & Sauce Gradient -->
    <linearGradient id="cheeseGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="90%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Rich San Marzano Tomato Sauce Gradient -->
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Crispy Cupping Pepperoni Gradient -->
    <radialGradient id="pepGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Golden Oil Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>

    <!-- Clean Contact Shadow -->
    <radialGradient id="sliceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full bleed dark background for iOS squircle crop -->
  <rect width="100" height="100" fill="#0b0f19" />

  <!-- Slice graphic scaled 0.90 for Apple Touch Icon -->
  <g transform="translate(50, 50) scale(0.90) translate(-50, -50)">
    <!-- Ground Contact Shadow -->
    <ellipse cx="50" cy="84" rx="35" ry="5.5" fill="url(#sliceShadow)" />

    <!-- Outer Crust Foundation (Thick Cornicione) -->
    <path d="M 16,28 C 36,16 64,16 84,28 C 87,35 83,40 76,41 C 60,35 40,35 24,41 C 17,40 13,35 16,28 Z"
          fill="url(#crustGrad)"
          stroke="#5c2406"
          stroke-width="2"
          stroke-linejoin="round" />

    <!-- Crust Cornicione Blisters & Char spots -->
    <ellipse cx="32" cy="24" rx="4.5" ry="3" fill="#451a03" opacity="0.65" />
    <ellipse cx="52" cy="21" rx="5.5" ry="3.2" fill="#451a03" opacity="0.75" />
    <ellipse cx="70" cy="25" rx="4" ry="2.8" fill="#451a03" opacity="0.6" />
    <ellipse cx="42" cy="23" rx="2.5" ry="1.8" fill="#fde047" opacity="0.6" />
    <ellipse cx="61" cy="22" rx="2.8" ry="1.8" fill="#fde047" opacity="0.5" />

    <!-- Main Pizza Slice Base (Sauce Layer) -->
    <path d="M 18,36 C 38,30 62,30 82,36 L 52,79 C 51,80.5 49,80.5 48,79 Z"
          fill="url(#sauceGrad)"
          stroke="#7f1d1d"
          stroke-width="1.5" />

    <!-- Melted Mozzarella Cheese Layer -->
    <path d="M 21,38 C 39,32 61,32 79,38 L 51.5,77 C 50.8,78 49.2,78 48.5,77 Z"
          fill="url(#cheeseGrad)" />

    <!-- Sauce Swirls / Peeking Tomato Sauce -->
    <path d="M 27,42 C 34,40 40,44 42,48 C 38,50 31,48 27,42 Z" fill="url(#sauceGrad)" opacity="0.85" />
    <path d="M 64,44 C 71,43 75,47 73,53 C 68,52 64,48 64,44 Z" fill="url(#sauceGrad)" opacity="0.85" />
    <path d="M 46,60 C 53,59 56,64 54,69 C 50,68 47,65 46,60 Z" fill="url(#sauceGrad)" opacity="0.8" />

    <!-- Pepperoni 1 (Upper Left) -->
    <ellipse cx="38" cy="46" rx="6.5" ry="5.5" fill="url(#pepGrad)" stroke="#450a0a" stroke-width="1.2" />
    <ellipse cx="37" cy="45" rx="4" ry="3.2" fill="#ef4444" opacity="0.3" />

    <!-- Pepperoni 2 (Upper Right) -->
    <ellipse cx="62" cy="48" rx="7" ry="6" fill="url(#pepGrad)" stroke="#450a0a" stroke-width="1.2" />
    <ellipse cx="61" cy="47" rx="4.5" ry="3.5" fill="#ef4444" opacity="0.3" />

    <!-- Pepperoni 3 (Center Lower) -->
    <ellipse cx="49" cy="62" rx="6" ry="5" fill="url(#pepGrad)" stroke="#450a0a" stroke-width="1.2" />
    <ellipse cx="48" cy="61" rx="3.5" ry="2.8" fill="#ef4444" opacity="0.3" />

    <!-- Melted Cheese Highlight / Sheen -->
    <path d="M 26,38 C 35,34 50,34 58,37 C 50,40 36,41 26,38 Z" fill="url(#sheenGrad)" />

    <!-- Fresh Basil / Oregano Herb Flecks -->
    <circle cx="34" cy="56" r="1.3" fill="#15803d" />
    <circle cx="56" cy="54" r="1.5" fill="#16a34a" />
    <circle cx="44" cy="71" r="1.2" fill="#15803d" />
    <circle cx="67" cy="40" r="1.1" fill="#166534" />
  </g>
</svg>
